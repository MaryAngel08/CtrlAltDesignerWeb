<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="av-wash" cx="40%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="42%" stop-color="#6D5FD8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0B0E1A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="av-ring" x1="18" y1="24" x2="64" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0D4FF" stop-opacity="0.95"/>
      <stop offset="38%" stop-color="#A78BFA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="av-facet" x1="28" y1="28" x2="54" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0D4FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="80" height="100" fill="#0B0E1A"/>
  <rect width="80" height="100" fill="url(#av-wash)"/>
  <circle cx="66" cy="80" r="24" fill="#8B5CF6" fill-opacity="0.14"/>
  <circle cx="16" cy="22" r="16" fill="#A78BFA" fill-opacity="0.08"/>

  <!-- outer halo -->
  <circle cx="40" cy="50" r="32" stroke="#C4B5FD" stroke-opacity="0.12" stroke-width="0.45"/>

  <!-- faceted hex, low opacity, behind the monogram -->
  <path d="M40 27.5 L52.5 34.8 V49.2 L40 56.5 L27.5 49.2 V34.8 Z"
        fill="url(#av-facet)"
        stroke="#C4B5FD"
        stroke-opacity="0.18"
        stroke-width="0.4"/>

  <!-- crystal ring -->
  <circle cx="40" cy="50" r="24.5" stroke="url(#av-ring)" stroke-width="1.35"/>
  <circle cx="40" cy="50" r="24.5"
          stroke="#E0D4FF"
          stroke-opacity="0.28"
          stroke-width="0.35"
          stroke-dasharray="1.8 4.2"
          transform="rotate(-18 40 50)"/>
  <circle cx="40" cy="50" r="18.5" stroke="#A78BFA" stroke-opacity="0.22" stroke-width="0.5"/>

  <!-- small shards -->
  <path d="M40 14.5 L42.4 19.2 L40 21.2 L37.6 19.2 Z" fill="#E0D4FF" fill-opacity="0.45"/>
  <path d="M61.5 43 L64.6 47.2 L61.2 49.4 L58.6 46.2 Z" fill="#A78BFA" fill-opacity="0.38"/>
  <path d="M18.8 55.5 L22.2 58.8 L18.6 62.2 L16.2 58.4 Z" fill="#C4B5FD" fill-opacity="0.3"/>
</svg>
